apply plugin: 'com.android.application'

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

def signingProperties = new Properties()
def signingFile = file(System.getenv('CAMPUS_SIGNING_FILE')
        ?: 'C:/AndroidSigning/campus-lostfound/signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

def dcloudAppKey = System.getenv('DCLOUD_APPKEY')
        ?: signingProperties.getProperty('dcloudAppkey', 'REPLACE_WITH_DCLOUD_APPKEY')

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    namespace 'com.lin.campuslostfound'

    defaultConfig {
        applicationId 'com.lin.campuslostfound'
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 100
        versionName '1.0.0'
        multiDexEnabled true
        manifestPlaceholders["DCLOUD_APPKEY"] = dcloudAppKey
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        release {
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.facebook.fresco:fresco:2.5.0'
    implementation 'com.facebook.fresco:animated-gif:2.5.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.8.0'
}

